name: Browser smoke test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: CI=true npm test -- --watch=false
      - name: Build production assets
        run: CI=true npm run build
      - name: Install temporary browser-test tooling
        run: |
          npm install --no-save --legacy-peer-deps playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Launch local static site
        run: |
          python3 - <<'PY' &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import os
          os.chdir('build')
          class Handler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  if not (Path('.' + self.path.split('?')[0]).exists()):
                      self.path = '/index.html'
                  super().do_GET()
          ThreadingHTTPServer(('127.0.0.1', 3000), Handler).serve_forever()
          PY
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test interactive map, table and mobile viewport
        run: node scripts/browser-smoke.cjs
