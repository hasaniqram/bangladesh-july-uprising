name: Phase 1.3 lockfile migration (temporary)
on:
  push:
    branches:
      - feature/phase-1-3-vite-security-modernization

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'hasaniqram/bangladesh-july-uprising' && github.ref == 'refs/heads/feature/phase-1-3-vite-security-modernization'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install current npm resolver
        run: npm install --global npm@11
      - name: Regenerate compatible npm lockfile without lifecycle scripts
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund || {
            tail -n 110 /home/runner/.npm/_logs/*-debug-0.log | tail -n 120
            exit 1
          }
      - name: Check reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Run migrated unit tests
        run: CI=true npm test -- --watch=false
      - name: Build Vite output
        run: npm run build
      - name: Commit lockfile on isolated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate npm lockfile for Phase 1.3'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/phase-1-3-vite-security-modernization
